<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"></stop>
      <stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"></stop>
      <stop offset="50%" stop-color="#60a5fa"></stop>
      <stop offset="100%" stop-color="#818cf8"></stop>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.55"></feDropShadow>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="34" fill="url(#bg)"></rect>

  <!-- Outer Ring -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"></circle>

  <!-- AI Orb -->
  <circle cx="64" cy="64" r="18" fill="url(#glow)" filter="url(#shadow)"></circle>

  <!-- Wave Lines -->
  <path d="M20 64
       C28 48, 40 48, 48 64
       C56 80, 72 80, 80 64
       C88 48, 100 48, 108 64" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round"></path>

  <!-- Spark -->
  <path d="M64 22
       L67 30
       L75 33
       L67 36
       L64 44
       L61 36
       L53 33
       L61 30 Z" fill="#93c5fd" filter="url(#shadow)"></path>

</svg>